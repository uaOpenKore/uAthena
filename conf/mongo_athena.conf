// Online statistics -> MongoDB (char-server only, SQL branch). S. 2026-11-21
//
// Every minute the char-server counts who is on a map-server (autotrade shops do not count); with
// @buyplaytime / @autopay the map-server reports the paid minutes. Every onlinestat_interval seconds a worker
// thread appends the sums to onlinestat_spool and pushes that file into MongoDB, one document per character
// and day ($inc), then empties the file. MongoDB down: the file grows and goes in at the next connection,
// the game never waits for MongoDB. Documents older than onlinestat_ttl_days are removed by MongoDB (TTL index).
//
// The credentials do NOT go here: put onlinestat_mongo_uri in conf/mongo_conf.txt. That file is not
// in git (.gitignore), so DEPLOY.sh (git reset --hard) leaves it alone and it is never committed.
// No onlinestat_mongo_uri = the statistics are off.

// mongodb://user:password@host:27017/?authSource=admin  (in conf/mongo_conf.txt)
//onlinestat_mongo_uri:

onlinestat_mongo_db: uaro
onlinestat_mongo_collection: online_daily

// The worker's file (relative to the server directory).
onlinestat_spool: log/online_spool.jsonl

// Seconds between the worker's rounds (10..3600): how far the site lags behind.
onlinestat_interval: 600

// Days MongoDB keeps a document (from the start of its day).
onlinestat_ttl_days: 365

import: conf/mongo_conf.txt
