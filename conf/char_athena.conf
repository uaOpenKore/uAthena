// Athena Character configuration file.

// Note: "Comments" are all text on the right side of a double slash "//"
// Whatever text is commented will not be parsed by the servers, and serves
// only as information/reference.

// Server Communication username and password.
userid: s1
passwd: p1

// Server name, use alternative character such as ASCII 160 for spaces.
// NOTE: You should not use spaces in the server name, or guild emblems won''t work client-side!
server_name: BornRok

// Wisp name for server: used to send wisp from server to players (between 4 to 23 characters)
wisp_server_name: Server

// Login Server IP
// The character server connects to the login server using this IP address.
// NOTE: This is useful when you are running behind a firewall or are on
// a machine with multiple interfaces.
//login_ip: 127.0.0.1

// The character server listens on the interface with this IP address.
// NOTE: This allows you to run multiple servers on multiple interfaces
// while using the same ports for each server.
//bind_ip: 127.0.0.1

// Login Server Port
login_port: 6900

// Character Server IP
// The character server exports this IP address to the entire world.
// NOTE: You should only need to set this if you are running behind a
// firewall or are on a machine with multiple interfaces.
// char_ip:127.0.0.1

// Character Server Port
char_port: 6121

//Time-stamp format which will be printed before all messages.
//Can at most be 20 characters long.
//Common formats:
// %I:%M:%S %p (hour:minute:second 12 hour, AM/PM format)
// %H:%M:%S (hour:minute:second, 24 hour format)
// %d/%b/%Y (day/Month/year)
//For full format information, consult the strftime() manual.
//timestamp_format: [%d/%b %H:%M]

//If redirected output contains escape sequences (color codes)
stdout_with_ansisequence: no

//Makes server output more silent by ommitting certain types of messages:
//1: Hide Information messages
//2: Hide Status messages
//4: Hide Notice Messages
//8: Hide Warning Messages
//16: Hide Error and SQL Error messages.
//Example: "console_silent: 7" Hides information, status and notice messages (1+2+4)
console_silent: 0

// Console Commands
// Allow for console commands to be used on/off
// This prevents usage of >& log.file
console: off

// Option to force a player to create an e-mail.
// If a player have default e-mail, and if you activate this option, the player can only connect in the game (to arrive on a map) like follow:
// - Create at least 1 character
// - Select 1 character
// - Select DEL to enter his/her e-mail. (if OK is choosen, client says to the player: 'invalid e-mail')
// - If his/her e-mail is correct, the player enter in the game (an e-mail is saved definitively).
// - If his/her e-mail is incorrect, he/she have 'incorrect e-mail' and must select again DEL.
// - After entering in the game (when the player arrives on a map), DEL and SEL/OK button work normaly for all next connections.
// Resume: If a player have "incorrect/invalid e-mail" when he/she click on 'OK' button,
//         the player must click 'DEL' button and register his/her NEW e-mail to enter in the game
// So, default is 0, because administrator must explain to their players before to activate this option.
email_creation: 0

// Is Character server in maintainence mode?
char_maintenance: 0

// Enable or disable creation of new characters.
// Now it is actually supported [Kevin]
char_new: 1

// Display (New) in the server list.
char_new_display: 0

// Maximum users able to connect to the server. Set to 0 for unlimited.
max_connect_user: 0

// When set to yes, the char server will refuse connections from players already online.
// When a login attempt is rejected, the account in question will be booted from all the connected map servers.
// Note that this only works within the char-server and it's connected mapservers,
// the charserver cannot know if the same account is logged on in other char servers.
// it's safe to turn off if the char-server only has a single map-server connected to it.
online_check: yes

// Minimum GM level that is allowed to bypass the server limit of users.
gm_allow_level: 99

// How often should the server save all files? (In seconds)
// Note: Applies to all data files on TXT servers.
// On SQL servers, it applies to guilds (character save interval is defined on the map config)
autosave_time: 60

// Display information on the console whenever characters/guilds/parties/pets are loaded/saved? 
save_log: yes

// Start point, Map name followed by coordinates (x,y)
start_point: new_zone01,53,111

// Starting weapon for new characters
start_weapon: 1208

// Starting armor for new characters
start_armor: 2301

// Starting zeny for new characters
start_zeny: 0

// Size for the fame-lists
fame_list_alchemist: 10
fame_list_blacksmith: 10
fame_list_taekwon: 10

// Guild earned exp modifier.
// Adjusts taxed exp before adding it to the guild's exp. For example, if set
// to 200, the guild receives double the player's taxed exp.
guild_exp_rate: 100

// Name used for unknown characters
unknown_char_name: Unknown

// To log the character server?
log_char: 1

// Log Filename
char_log_filename: log/char.log

// Allow or not identical name for characters but with a different case (upper/lower):
// example: Test-test-TEST-TesT; Value: 0 not allowed (default), 1 allowed
name_ignoring_case: 0

// Manage possible letters/symbol in the name of charater. Control character (0x00-0x1f) are never accepted. Possible values are:
// NOTE: Applies to character, party and guild names.
// 0: no restriction (default)
// 1: only letters/symbols in 'char_name_letters' option.
// 2: Letters/symbols in 'char_name_letters' option are forbidden. All others are possibles.
char_name_option: 0

// Set the letters/symbols that you want use with the 'char_name_option' option.
// Note: Don't add spaces unless you mean to add 'space' to the list.
char_name_letters: abcdefghijklmnopqrstuvwxyzйцукенгшщзхїфівапролджєячсмитьбю ABCDEFGHIJKLMNOPQRSTUVWXYZ1234567890ЙЦУКЕНГШЩЗХЇФІВАПРОЛДЖЄЯЧСМИТЬБЮ

// Character rename option. When set to yes, the server will send an extended
// char-info packet, informing whether the character can be renamed or not.
// NOTE: This functionality is not implemented.
// NOTE: This option is for compatibility with kRO sakray 2006-10-23 and newer.
//       !Do not use it for any other type of client since it will crash them!
char_rename: yes

// How many Characters are allowed per Account ? (0 = disabled) [SQL Only!]
chars_per_account: 0

// Restrict character deletion by BaseLevel
// 0: no restriction (players can delete characters of any level)
// -X: you can't delete chars with BaseLevel <= X
// Y: you can't delete chars with BaseLevel >= Y
// e.g. char_del_level: 80 (players can't delete characters with 80+ BaseLevel)
char_del_level: 0

// What folder the DB files are in (item_db.txt, etc.)
db_path: db

// Server-to-server logins (map-servers) are accepted only from this host (127.0.0.1 and every address of this
// machine, its external IP included) and from the addresses listed here: "a.b.c.d" or "a.b.c.d/nn", comma
// separated. Needed only when a server runs on ANOTHER machine. A refused try closes the connection.
//map_server_ip_allow: 10.0.0.5, 192.168.1.0/24

// Server metrics in the console log: 0 off, 1 summaries, 2 summaries + events (default 2).
//  [LOOPMETRIC] every 60 s (see map_athena.conf); [SAVEMETRIC] every savemetric_interval s: saves written / refused
//  for an offline character / failed in SQL, pending retries, final (logout) save time; with 2 a line for each
//  refused save. [RELOGMETRIC] every relogmetric_interval s: accounts with over 10 character selects.
metrics_log: 2
savemetric_interval: 600
relogmetric_interval: 3600

// [archive] Inactive accounts move into the archive tables (arc_index, arc_<table>; the char-server makes them)
// and come back, with new ids, when their owner logs in with the right password (Doc/account_archive.md).
// Player accounts only (id 2000000+, no server accounts), GM and banned ones too; never one that is online,
// at the character select or has an autotrade shop open. A guild master's guild is broken.
// account_archive_mode: 0 = off, 1 = only log once a day whom it would archive, 2 = archive.
account_archive_mode: 2
// days without a login (an account that never logged in: days since its registration, login.created)
account_archive_days: 365
// the local hour the runs happen in (-1 = any hour), accounts per run, seconds between runs
account_archive_hour: 5
account_archive_batch: 10
account_archive_interval: 60

// [idcompact] At start, before anything is loaded and anyone can connect, the ids freed by deletions and the archive
// are reused: accounts (from 2000000), characters, guilds, parties, pets, homunculi, mercenaries and the row ids of
// inventory / cart / storage / guild storage / memo are renumbered densely in their old order, every column that
// holds them (found in the schema by name; not the logs or the archive) and the maker / pet ids inside items follow;
// rows pointing at ids that no longer exist are deleted (a spouse, family, leader, castle owner, pet owner: set to 0);
// then AUTO_INCREMENT = MAX+1 in every table (Doc/id_compact.md).
// id_compact_mode: 0 = off, 1 = only log what it would do, 2 = do it (best right after the monthly dump).
id_compact_mode: 1
// > 0: more rows pointing at missing ids than this and nothing is changed (0 = no limit)
id_compact_orphan_max: 0

// [webstorage] Item requests from the web site (table web_storage_request, made at start; Doc/web_storage.md):
// the site never writes the item tables, the char-server moves / adds / removes the items when the game holds
// none of them in memory (the account offline, the guild storage closed; needs guild_storage_lock: 1).
// web_storage: 0 = off, 1 = on; how often (s), how many per run, how long a busy request waits (s).
web_storage: 1
web_storage_interval: 3
web_storage_batch: 20
web_storage_wait: 600

import: conf/import/char_conf.txt
