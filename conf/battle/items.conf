//--------------------------------------------------------------
// eAthena Battle Configuration File
// Originally Translated by Peter Kieser <pfak@telus.net>
// Made in to plainer English by Ancyker
//--------------------------------------------------------------
// Note 1: Value is a config switch (on/off, yes/no or 1/0)
// Note 2: Value is in percents (100 means 100%)
// Note 3: Value is a bit field. If no description is given,
//         assume unit types (1: Pc, 2: Mob, 4: Pet, 8: Homun)
//--------------------------------------------------------------

// The highest value at which an item can be sold via the merchant vend skill. (in zeny)
vending_max_value: 1000000000

// Tax to apply to all vending transactions (eg: 10000 = 100%, 50 = 0.50%)
// When a tax is applied, the item's full price is charged to the buyer, but
// the vender will not get the whole price paid (they get 100% - this tax).
vending_tax: 200

// [Backport] Buying store (skup): a merchant with the Open Buying Store skill
// posts items he wants to BUY, others sell them to him. On the 2007 client
// it is driven by chat: @buystore (owner), @buymarket / @sellto (seller).
// 0: disabled, 1: enabled.
feature_buying_store: 1

// [Backport] Buying store item restriction.
// 0: any tradable item may be bought (like vending).
// 1: only items listed in db/item_buyingstore.txt may be bought.
buyingstore_restrict_items: 0

// Show the buyer's name when successfully vended an item
buyer_name: yes

// Forging success rate. (Note 2)
weapon_produce_rate: 100

// Prepare Potion success rate. (Note 2)
potion_produce_rate: 100

// Do produced items have the maker's name on them? (Note 3)
// 0x01: Produced Weapons
// 0x02: Produced Potions
// 0x04: Produced Arrows
// 0x08: Produced Holy Water
// 0x10: Produced Deadly Potions
// 0x80: Other produced items.
produce_item_name_input: 0x03

// Is a monster summoned via dead branch aggressive? (Note 1)
dead_branch_active: yes

// Are summoned monsters level greater then your base level? (dead branches) (Note 1)
random_monster_checklv: yes

// Can any player equip any item regardless of the gender restrictions
//	NOTE: Wedding Rings and Whips/Musical Instruments will check gender regardless of setting.
ignore_items_gender: yes

// Item check? (Note 1)
// On map change it will check for items not tagged as "available" and
// auto-delete them from inventory/cart.
// NOTE: An item is not available if it was not loaded from the item_db or you
// specify it as unavailable in db/item_avail.txt
item_check: no

// How much time must pass between item uses?
// Only affects the delay between using items, prevents healing item abuse. Recommended ~500 ms
// On officials this is 0, but it's set to 100ms as a measure against bots/macros.
item_use_interval: 100

//Required level of bNoMagicDamage before Status Changes are blocked (Golden Thief Bug card).
//For example, if left at 50. An item can give bNoMagicDamage,40;
// which reduces magic damage by 40%, but does not blocks status changes.
gtb_sc_immunity: 50

// Enable autospell card effects to stack?
// NOTE: Different cards that grant the same skill will both
// always work independently of each other regardless of setting.
autospell_stacking: no

// =========================================================================
// Over-refine: refining equipment past +10, up to +99 [refine99]
// =========================================================================
// The canonical +0..+10 refine (success table db/refine_db.txt and the ATK/DEF
// bonus) is UNCHANGED. Everything below only affects levels +11 and above, and
// is fully formula-driven (no giant tables). Set refine_player_max to 10 to turn
// the whole feature off (pure vanilla). GM @refine/@item always reach +99.

// Highest refine players can reach through the refiner NPC (Hollengrhen & co).
// Hard ceiling is 99. Set to 10 to disable over-refine for players.
refine_player_max: 99

// Success chance (%) of the very first over-refine step (+10 -> +11).
refine_over_chance: 20

// Percent subtracted from the success chance for each further level
// (+11->+12 is chance-step, +12->+13 is chance-2*step, ...).
refine_over_chance_step: 1

// Floor for the over-refine success chance (it never drops below this).
refine_over_chance_min: 5

// ATK/DEF granted per level ABOVE +10, expressed as a percent of the normal
// per-level refine bonus. 100 = same slope as +0..+10 (very strong at +99),
// 50 = half (default), lower = flatter. Curbs the linear blow-up at high refine.
refine_over_bonus_percent: 50

// What happens when an over-refine (+11..+99) attempt FAILS:
//   0 = destroy the item (classic refine behaviour)
//   1 = drop it by one refine level, item survives (default)
//   2 = keep the item as-is (only the materials/zeny are lost)
// Levels +0..+10 always use the classic destroy-on-fail rule regardless.
refine_over_fail: 1
