//--------------------------------------------------------------
// uAthena CPU affinity (#switch-cpu)
//--------------------------------------------------------------
// Pin the whole server process to a subset of CPU cores. Useful when the server and the game
// client run on the SAME machine (e.g. a Nintendo Switch under L4T Linux, where only 3 CPU cores
// are available) — keep the server off the core the client renders on so the client keeps its FPS.
//
// cpu_cores: comma/space separated 0-based core numbers the server MAY use. Applies to login-,
// char- and map-server (each reads this file at startup). Set it before any worker thread spawns,
// so all threads inherit the mask.
//
// Linux only (uses sched_setaffinity); ignored on other platforms. The env var UATHENA_CPU_CORES,
// if set, overrides this file. Leave commented out = no change (server uses every core, as before).
//
// Example for a 4-core Switch (cores 0..2 free; the OS reserves core 3): give the client core 0,
// run the whole server on cores 1 and 2:
//
//cpu_cores: 1,2
