//--------------------------------------------------------------
// uAthena Discord webhook relay
//--------------------------------------------------------------
// Posts the rare-drop global announces (the same ones battle/drops.conf's rare_drop_announce
// shows in game — drops with chance <= 0.01%) to a Discord channel, from a background thread
// so it never blocks the map server. Messages look like:
//   'Lupin4' won Boa's Shining Scale (chance: 0.01%)
//
// Setup (one time):
//   1. In Discord, open the target channel (#notifications on the Neon Hearts server).
//   2. Edit Channel -> Integrations -> Webhooks -> New Webhook -> Copy Webhook URL.
//   3. The webhook URL is a SECRET -- do NOT put it in this (git-tracked) file. Instead edit
//      conf/import/discord_conf.txt ON THE SERVER and set there (it overrides this file and is
//      kept out of git):
//          discord_announce: yes
//          discord_webhook: <paste the URL>
//   4. Restart the map server (no recompile needed to change these values).
//
// Requires the `curl` command to be installed on the server host.

// Master switch. Keep "no" until the webhook URL below is filled in.
discord_announce: no

// The channel's incoming-webhook URL (https://discord.com/api/webhooks/<id>/<token>).
discord_webhook:

// Bot display name shown in Discord.
discord_username: uAthena
