repos:
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v17.0.6
    hooks:
      - id: clang-format
        types_or: [c, c++]
  - repo: https://github.com/pre-commit/mirrors-clang-tidy
    rev: v17.0.6
    hooks:
      - id: clang-tidy
        types_or: [c, c++]
        require_serial: true
