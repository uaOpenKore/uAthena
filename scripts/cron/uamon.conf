# uamon.conf - shared config for the map-server load monitor (sourced by all
# scripts/cron/uamon-*.sh). Edit to match your deployment.

# --- MongoDB 7 (mongosh) --------------------------------------------------
MONGO_URI="${MONGO_URI:-mongodb://127.0.0.1:27017}"
MONGO_DB="${MONGO_DB:-uamon}"
MONGOSH="${MONGOSH:-mongosh}"
COLL_MIN="stat_min"        # per-minute raw
COLL_10MIN="stat_10min"    # 10-minute aggregate (avg + peak)
COLL_HOUR="stat_hour"      # hourly aggregate (avg + peak)

# --- char DB (read online players per map) --------------------------------
# Must match conf/inter_athena.conf char_server_ip / _id / _pw / _db.
SQL_CLIENT="${SQL_CLIENT:-mysql}"   # mysql or mariadb
SQL_HOST="${SQL_HOST:-127.0.0.1}"
SQL_PORT="${SQL_PORT:-3306}"
SQL_USER="${SQL_USER:-ragnarok}"
SQL_PASS="${SQL_PASS:-ragnarok}"
SQL_DB="${SQL_DB:-ragnarok}"
CHAR_TABLE="${CHAR_TABLE:-char}"

# --- uAthena layout -------------------------------------------------------
UA_BIN_DIR="${UA_BIN_DIR:-/opt/uathena/bin}"   # holds PID-mapN.pid and confN/

# --- sampling -------------------------------------------------------------
# CPU is measured as a DELTA between two samples (the busiest thread's current
# %CPU, 0-100 of one core). This is how long the per-minute script runs.
CPU_SAMPLE_SECS="${CPU_SAMPLE_SECS:-4}"

# --- retention (days) - cleanup removes docs older than this --------------
RET_MIN_DAYS="${RET_MIN_DAYS:-62}"      # per-minute  ~ 2 months
RET_10MIN_DAYS="${RET_10MIN_DAYS:-183}" # 10-minute   ~ 6 months
RET_HOUR_DAYS="${RET_HOUR_DAYS:-730}"   # hourly      ~ 2 years
